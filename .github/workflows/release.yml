name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    name: Build and upload package tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: pnpm pack --pack-destination dist-pack

      - name: Generate checksums
        working-directory: dist-pack
        run: sha256sum *.tgz > checksums.txt

      - name: Upload tarball to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist-pack/*.tgz \
            dist-pack/checksums.txt \
            --clobber
